name: docker workflow

on:
  workflow_dispatch:
    inputs:
      dockerimage:
        description: Docker image name
        required: true
        default: spring
      DOCKERHUB_USERNAME:
        description: Docker Hub username
        required: true
        default: 123sri

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.event.inputs.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and Push (Main)
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ github.event.inputs.DOCKERHUB_USERNAME }}/${{ github.event.inputs.dockerimage }}:${{ github.run_id }}

      - name: Build and Push (Snapshot)
        if: github.ref_name != 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ github.event.inputs.DOCKERHUB_USERNAME }}/${{ github.event.inputs.dockerimage }}-snapshot:${{ github.run_id }}
