name: steps testing

on:
  push:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18 ,20]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install node.js
        uses: actions/setup -node@v7
        with:
          node-version: ${{matrix. node-version}}
