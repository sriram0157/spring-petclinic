name: docker workflow
on:
  workflow_dispatch:
    inputs:
      dockerimage:
        default: spring
        type: string
        required: true
      DOCKER_USERNAME:
        type: string
        default: 123sri
        required: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install docker
        uses: docker/setup-buildx-action@v4

      - name: Log in to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.events.inputs.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: ${{github.ref_name == 'main' }}
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.dockerimage }}:${{ github.run_id}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: ${{github.ref_name != 'main' }}
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.dockerimage }}-snapshot:${{ github.run_id}}
          
 
 
